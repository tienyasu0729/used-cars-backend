
name: Deploy Backend

on:

  push:

    branches:

      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy backend

        uses: appleboy/ssh-action@master

        with:

          host: ${{ secrets.HOST }}

          username: ${{ secrets.USERNAME }}

          key: ${{ secrets.SSH_KEY }}

          port: ${{ secrets.PORT }}

          script: |

            cd /var/www/used-cars-backend

            git reset --hard

            git pull origin main

            chmod +x mvnw

            ./mvnw clean package -Dmaven.test.skip=true

            pkill -f "used-cars-backend-0.0.1-SNAPSHOT.jar" || true

            sleep 2

            nohup java -jar target/used-cars-backend-0.0.1-SNAPSHOT.jar > /var/log/used-cars-backend.log 2>&1 &

            disown

            echo "Deploy done"

