spring.application.name=used-cars-backend

# AI vehicle pricing proxy (rag_chatbot /internal/vehicle-pricing). Override via application.yml or env.
app.pricing.enabled=true
app.pricing.base-url=http://localhost:8000
app.pricing.estimate-path=/internal/vehicle-pricing/estimate
app.pricing.internal-token=pricing_internal_local_token
app.pricing.connect-timeout-ms=15000
app.pricing.read-timeout-ms=600000
